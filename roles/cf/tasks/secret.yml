---
# Ensure one podman secret exists. Include once per secret.
#
# CONTRACT -- in
#   cf_secret_var     (required) name of the variable holding the seed value,
#                     e.g. "cf_db_password". This is the real variable name, not
#                     a short key: nothing is prepended or remapped.
#   cf_secret_length  (optional) bytes of entropy when generating, default 32
#   cf_secret_rotate  (optional) true => replace even if it already exists
#
# CONTRACT -- out
#   cf_secret_changed bool, true if this call created or replaced the secret
#
# NAMING
#   podman secret name :  {{ cf_instance }}_{{ cf_secret_var }}
#
#   cf_secret_var: cf_db_password  ->  secret  rcs_cf_db_password
#
#   Consumers reference the same name, so keep them in step:
#     - postgres container   secrets: ["{{ cf_instance }}_cf_db_password"]
#     - pg.env.j2            POSTGRES_PASSWORD_FILE=/run/secrets/<name>
#     - app container        secrets: ["{{ cf_instance }}_cf_db_password"]
#     - settings template    open("/run/secrets/<name>")
#
# SEEDING
#   The seed variable must be declared, even if blank. Declare each one in
#   defaults/main.yml so every secret's seam is visible:
#
#     cf_db_password: ""
#
#   blank    -> a value is generated on the target
#   set      -> that value is installed as-is (vault it)
#
#   Either way the secret is written once and never rewritten, so an
#   unconfigured instance comes up without a vault and repeat runs cannot
#   rotate a working password.
#
#   An undeclared cf_secret_var is a typo and fails the play. Without that
#   check a misspelled variable name would look like success while silently
#   generating a random value instead of installing the intended one.
#
# ROTATION
#   cf_secret_rotate removes and recreates. Mounted secrets are copied into a
#   container when it is created, so a rotated secret needs the consuming
#   containers recreated, not reloaded. Use cf_secret_changed to drive that.
#
# NOTE  The generated value never reaches the control node: entropy is produced
#   on the target and piped straight into podman, so it is absent from Ansible
#   output, from disk, and from the process list. A seeded value necessarily
#   passes through Ansible, but podman_secret sends it over stdin rather than
#   argv.

- name: "Secret: resolve {{ cf_secret_var }}"
  ansible.builtin.set_fact:
    _cf_secret_name: "{{ cf_instance }}_{{ cf_secret_var }}"
    _cf_secret_seed: "{{ lookup('vars', cf_secret_var, default='__CF_UNDEF__') | string }}"
  no_log: true

# Fail here with something readable rather than letting podman reject the name
# with exit 125, and catch an undeclared seed variable before it turns into a
# silently generated password.
- name: "Secret: validate {{ cf_secret_var }}"
  ansible.builtin.assert:
    that:
      - _cf_secret_seed != '__CF_UNDEF__'
      - _cf_secret_name is match('^[A-Za-z0-9._-]{1,253}$')
    fail_msg: >-
      Bad secret specification for cf_secret_var={{ cf_secret_var }}
      (composed name {{ _cf_secret_name }}).
      Either the variable is not declared -- add `{{ cf_secret_var }}: ""` to
      defaults/main.yml, where blank means generate on the target -- or the
      composed name is invalid. It must match ^[A-Za-z0-9._-]{1,253}$; podman
      rejects '=', '/', ',' and NUL. A name containing a path fragment usually
      means cf_instance holds a path rather than an instance name.
    quiet: true

- name: "Secret: check for existence {{ _cf_secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, inspect, "{{ _cf_secret_name }}"]
  register: _cf_secret_state
  changed_when: false
  failed_when: false

- name: "Secret: remove for rotation {{ _cf_secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, rm, "{{ _cf_secret_name }}"]
  when:
    - cf_secret_rotate | default(false) | bool
    - _cf_secret_state.rc == 0
  changed_when: true

- name: "Secret: decide whether need to create {{ _cf_secret_name }}"
  ansible.builtin.set_fact:
    _cf_secret_needed: "{{ _cf_secret_state.rc != 0 or (cf_secret_rotate | default(false) | bool) }}"

# Seeded from inventory or vault. podman_secret sends the value on stdin.
- name: "Secret: install {{ _cf_secret_name }}"
  containers.podman.podman_secret:
    name: "{{ _cf_secret_name }}"
    data: "{{ _cf_secret_seed }}"
    state: present
    skip_existing: true
  no_log: true
  when:
    - _cf_secret_needed | bool
    - _cf_secret_seed | length > 0

# No seed declared. Entropy is produced on the target and piped straight into
# podman, so the value never reaches the control node, never hits disk, and
# never appears in the process list.
- name: "Secret: generate {{ _cf_secret_name }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      openssl rand -hex {{ cf_secret_length | default(32) }}
      | tr -d '\n'
      | podman secret create {{ _cf_secret_name | quote }} -
    executable: /bin/bash
  when:
    - _cf_secret_needed | bool
    - _cf_secret_seed | length == 0
  changed_when: true

- name: "Secret: publish result for {{ _cf_secret_name }}"
  ansible.builtin.set_fact:
    cf_secret_changed: "{{ _cf_secret_needed | bool }}"
